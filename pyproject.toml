[project]
name = "research-mcp-service"
version = "0.1.0"
description = "Private per-user research environments for a hosted MCP service (development)"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "httpx>=0.27.0",
  "ddgs==9.16.0",
  "pydantic>=2.8.0",
  "redis>=5.0.0",
  "minio>=7.2.0",
  "trafilatura>=1.12.0",
  "markdownify>=1.2.0,<2",
  "beautifulsoup4>=4.12,<5",
  "playwright>=1.50.0",
  "camoufox[geoip]>=0.4.0",
  "pypdfium2>=5.0.0",
  "python-docx>=1.1.0",
  "python-pptx>=1.0.0",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
