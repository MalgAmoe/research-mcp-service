# Fresh-server overlay only. Existing development deployments do not use this file.
services:
  control:
    image: research-mcp-${TENANT_ID}-control:local
    environment:
      GATEWAY_SOCKET: /control-rpc/gateway.sock
    volumes:
      - ./.state/control-rpc:/control-rpc
    healthcheck:
      test: [CMD, python, -c, "import httpx,os; c=httpx.Client(transport=httpx.HTTPTransport(uds='/control-rpc/gateway.sock'),base_url='http://control',headers={'Authorization':'Bearer '+os.environ['GATEWAY_TOKEN']}); c.get('/health',timeout=3).raise_for_status()"]
  fetch-worker:
    image: research-mcp-${TENANT_ID}-worker:local
  egress:
    image: research-mcp-${TENANT_ID}-egress:local
  egress-check:
    image: research-mcp-${TENANT_ID}-egress:local
