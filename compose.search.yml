# Single-user search prototype only. Separate project, no shared volumes or Redis.
name: research-mcp-search-${MCP_INSTANCE_ID:-dev}
services:
  searxng:
    image: searxng/searxng@sha256:23482d8ecf7ddf66029479468ea04c1bb11d2b65785a17a7e629e2ffd13296ca
    restart: unless-stopped
    mem_limit: 1g
    cpus: 2
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:${MCP_SEARCH_PORT:-18080}:8080"
    environment:
      SEARXNG_BASE_URL: http://127.0.0.1:${MCP_SEARCH_PORT:-18080}/
      SEARXNG_SECRET: ${SEARXNG_SECRET:?Generate a unique secret in .env.search}
    # Override image-declared anonymous volumes: this search cache is disposable.
    tmpfs:
      - /etc/searxng:size=16m,mode=1777
      - /var/cache/searxng:size=64m,mode=1777
    volumes:
      - ./infra/searxng-primary.yml:/etc/searxng/settings.yml:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/"]
      interval: 10s
      timeout: 3s
      retries: 10
