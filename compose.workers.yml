# Merge with docker-compose.yml and compose.control.yml for isolated execution.
services:
  egress:
    profiles: [workers]
    build:
      context: .
      dockerfile: Dockerfile.egress
    image: research-mcp-egress:dev
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    restart: unless-stopped
    networks: [egress]
    volumes:
      - egress_socket:/egress
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  fetch-worker:
    profiles: [workers]
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: research-mcp-fetch-worker:dev
    user: "10001:10001"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    mem_limit: 2g
    cpus: 2
    pids_limit: 512
    restart: unless-stopped
    environment:
      FETCH_PROXY: http://127.0.0.1:3128
    tmpfs:
      - /tmp:size=536870912,mode=1777
    volumes:
      - egress_socket:/egress:ro
      - worker_rpc:/rpc
    depends_on:
      egress:
        condition: service_started
    healthcheck:
      test: [CMD, python, -c, "import socket; s=socket.socket(socket.AF_UNIX); s.settimeout(3); s.connect('/rpc/worker.sock'); s.sendall(b'GET /health HTTP/1.1\\r\\nHost: worker\\r\\nConnection: close\\r\\n\\r\\n'); assert b'200 OK' in s.recv(512)"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  egress-check:
    profiles: [verification]
    image: research-mcp-egress:dev
    user: "10001:10001"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    volumes:
      - egress_socket:/egress:ro
    command: [python, /app/check_worker_egress.py]

networks:
  egress:

volumes:
  egress_socket:
  worker_rpc:
