# Independent private storage. Add compose.workers.yml and compose.control.yml for execution.
name: research-mcp-${TENANT_ID:?Set a unique TENANT_ID in this project configuration}

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  redis:
    networks: [storage]
    image: redis@sha256:b9646e7cdf8165d985b88bb3e61b3f2f7625db7f6c98af79def91997d04f26b9
    logging: *logging
    mem_limit: 512m
    cpus: 1
    pids_limit: 128
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  s3:
    networks: [storage]
    image: chrislusf/seaweedfs:4.51@sha256:f7a49e3f3972ebed5be2ed4befa4a0c68eb7bdddba6e692d42729ceb545134b8
    logging: *logging
    mem_limit: 1g
    cpus: 2
    pids_limit: 256
    restart: unless-stopped
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?Set unique S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?Set unique S3_SECRET_KEY}
    volumes:
      - s3_data:/data
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=134217728,mode=1777"]
    command: ["mini", "-dir=/data", "-ip=127.0.0.1", "-ip.bind=0.0.0.0", "-master.telemetry=false", "-admin.ui=false", "-webdav=false"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8333/readyz"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

networks:
  storage:
    internal: true

volumes:
  redis_data:
  s3_data:
