# Independent private storage. Add compose.workers.yml and compose.control.yml for execution.
name: research-mcp-${TENANT_ID:?Set a unique TENANT_ID in this project configuration}

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  redis:
    networks: [storage]
    image: redis@sha256:b9646e7cdf8165d985b88bb3e61b3f2f7625db7f6c98af79def91997d04f26b9
    logging: *logging
    mem_limit: 512m
    cpus: 1
    pids_limit: 128
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    networks: [storage]
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    logging: *logging
    mem_limit: 1g
    cpus: 2
    pids_limit: 256
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Set unique MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Set unique MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  storage:
    internal: true

volumes:
  redis_data:
  minio_data:
